<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Workout &amp; GPX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;
  --card:#1c1c1e;
  --sep:#38383a;
  --text:#ffffff;
  --muted:#636366;
  --work:#c9ff3b;
}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}
body{display:flex;flex-direction:column}
.views{flex:1;min-height:0;position:relative}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.views iframe[hidden]{display:none}
.tabs{
  display:flex;background:var(--card);border-top:1px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px;background:none;border:none;color:var(--muted);
  font:inherit;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:color .15s;
}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--work)}
.tab:focus-visible{outline:2px solid var(--work);outline-offset:-4px;border-radius:8px}
</style>
</head>
<body>
<main class="views">
  <iframe id="v-timer" title="Timer Workout" src="timer.html"></iframe>
  <iframe id="v-gpx" title="GPX Rute Sepeda" hidden></iframe>
</main>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-timer" data-tab="timer" aria-selected="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg>
    Timer
  </button>
  <button class="tab" role="tab" id="t-gpx" data-tab="gpx" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16"/></svg>
    GPX
  </button>
</nav>
<script>
const frames = { timer: document.getElementById('v-timer'), gpx: document.getElementById('v-gpx') };
const srcs = { timer: 'timer.html', gpx: 'gpx.html' };

function show(name) {
  if (!frames[name]) name = 'timer';
  // GPX baru dimuat saat pertama dibuka; timer tetap hidup di latar belakang
  if (!frames[name].getAttribute('src')) frames[name].src = srcs[name];
  for (const k in frames) {
    frames[k].hidden = k !== name;
    document.getElementById('t-' + k).setAttribute('aria-selected', k === name);
  }
  try { history.replaceState(null, '', '#' + name); } catch {}
  frames[name].contentWindow?.postMessage('shown', '*');
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.tab));
show(location.hash.slice(1) || 'timer');
</script>
</body>
</html>
